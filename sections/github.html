<!-- =========================================================================
     GitHub Commit Activity & Contribution Chart
     ========================================================================= -->
<section class="section github-section-wrapper" id="github">
  <div class="container">
    <div class="section-header text-center">
      <span class="section-tag"><i class="fa-brands fa-github"></i> Open Source Track Record</span>
      <h2 class="section-title">GitHub <span>Commit Activity</span></h2>
      <p class="section-subtitle">Real-time commit calendar graph and year-round contribution frequency.</p>
    </div>

    <!-- GitHub Activity Minimal Card (Matching Reference Design) -->
    <div class="gh-activity-card">
      <div class="gh-activity-title">GITHUB ACTIVITY</div>

      <div class="gh-activity-scroll-wrapper">
        <div class="gh-activity-chart-container">
          <!-- Month Labels Row -->
          <div class="gh-months-row" id="gh-months-row">
            <span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span>
            <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span>
            <span>May</span><span>Jun</span><span>Jul</span><span>Aug</span>
          </div>

          <!-- Contribution Heatmap Grid (52 weeks x 7 days) -->
          <div class="gh-heatmap-matrix" id="gh-heatmap-matrix">
            <!-- Dynamically populated via js/app.js -->
          </div>
        </div>
      </div>

      <!-- Activity Summary & Legend Row -->
      <div class="gh-activity-summary-row">
        <div class="gh-total-contributions" id="gh-total-contributions-text">
          <span id="gh-contrib-count">797</span> contributions in the last year
        </div>
        <div class="gh-activity-legend">
          <span class="gh-legend-label">Less</span>
          <div class="gh-legend-boxes">
            <span class="gh-box lvl-0"></span>
            <span class="gh-box lvl-1"></span>
            <span class="gh-box lvl-2"></span>
            <span class="gh-box lvl-3"></span>
            <span class="gh-box lvl-4"></span>
          </div>
          <span class="gh-legend-label">More</span>
        </div>
      </div>

      <!-- View Full Profile Link -->
      <div class="gh-activity-profile-action">
        <a href="https://github.com/iamabdullahhossain" target="_blank" rel="noopener noreferrer" class="gh-view-profile-btn">
          View full profile
        </a>
      </div>
    </div>
  </div>
</section>
